[project]
name = "invoicing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "arq>=0.26",
    "apscheduler>=3.10",
    "boto3>=1.34",
    "pypdf>=4.2",
    "lxml>=5.2",
    "cryptography>=42.0",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "mcp>=2.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.8,<3",
    "setuptools>=68",
    "paddlepaddle>=2.5,<3",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicing"]

[tool.pytest.ini_options]
testpaths = ["../test"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
